{% extends "base.html" %}

{% block title %}Nuevo Cliente{% endblock %}

{% block content %}
    <div class="container">
        <h2 class="form-title">Registrar Nuevo Cliente</h2>
        <div class="form-wrapper">
            <form action="{{ url_for('clientes.nuevo_cliente') }}" method="POST">
                
                <input type="hidden" id="latitud" name="latitud">
                <input type="hidden" id="longitud" name="longitud">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" name="dni" required>
                    </div>

                    <div class="form-group">
                        <label for="celular">Celular:</label>
                        <input type="text" id="celular" name="celular" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico (Opcional):</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="operadora">Operadora:</label>
                        <select id="operadora" name="operadora" required>
                            <option value="Claro">Claro</option>
                            <option value="Movistar">Movistar</option>
                            <option value="Entel">Entel</option>
                            <option value="Bitel">Bitel</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="banco">Banco:</label>
                        <select id="banco" name="banco" required>
                            <option value="BN">BN</option>
                            <option value="BCP">BCP</option>
                            <option value="INTERBANK">INTERBANK</option>
                            <option value="BBVA">BBVA</option>
                            <option value="SCOTIABANK">SCOTIABANK</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="numero_cuenta">Número de Cuenta:</label>
                        <input type="text" id="numero_cuenta" name="numero_cuenta" required>
                    </div>
                </div>
                
                <div class="mt-4 p-3 bg-light border rounded">
                    <h5 class="mb-3 text-secondary"><i class="bi bi-geo-alt-fill"></i> Ubicación del Domicilio</h5>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" name="direccion" placeholder="Calle, Número, Zona" required>
                        </div>
                        <div class="form-group">
                            <label for="referencia">Referencia:</label>
                            <input type="text" id="referencia" name="referencia" placeholder="Frente a la tienda, casa color verde...">
                        </div>
                    </div>

                    <div class="mt-3 text-center">
                        <button type="button" class="btn btn-outline-danger w-100" onclick="obtenerUbicacion()">
                            <i class="bi bi-crosshair"></i> Capturar Ubicación GPS Actual
                        </button>
                        <small id="statusGPS" class="text-muted d-block mt-2">Presiona el botón para guardar la ubicación exacta.</small>
                    </div>
                </div>

                <div class="form-group mt-4">
                    <label for="grupo_id">Seleccionar Grupo:</label>
                    <select name="grupo_id" required class="form-control">
                        {% for grupo in grupos %}
                            <option value="{{ grupo.id }}">{{ grupo.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-submit">Crear Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function obtenerUbicacion() {
            const status = document.getElementById('statusGPS');
            const btn = document.querySelector('button[onclick="obtenerUbicacion()"]');

            if (!navigator.geolocation) {
                status.innerHTML = '<i class="bi bi-x-circle"></i> Tu navegador no soporta geolocalización.';
                status.className = 'text-danger fw-bold d-block mt-2';
                return;
            }

            status.innerHTML = '<i class="bi bi-hourglass-split"></i> Solicitando permiso al dispositivo...';
            status.className = 'text-warning fw-bold d-block mt-2';
            btn.disabled = true; // Evitar doble clic

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // ÉXITO
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy; // Precisión en metros

                    document.getElementById('latitud').value = lat;
                    document.getElementById('longitud').value = lon;

                    status.innerHTML = `✅ Ubicación capturada (Precisión: ${accuracy.toFixed(0)}m)<br>Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                    status.className = 'text-success fw-bold d-block mt-2';
                    btn.disabled = false;
                },
                (error) => {
                    // ERROR
                    let mensajeError = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            mensajeError = "❌ Permiso denegado. Debes autorizar el uso del GPS en tu navegador.";
                            // Aquí es donde cae si no tienes HTTPS
                            if (window.location.protocol !== 'https:') {
                                mensajeError += "<br>⚠️ Nota: En celulares, esto suele requerir conexión segura (HTTPS).";
                            }
                            break;
                        case error.POSITION_UNAVAILABLE:
                            mensajeError = "❌ La información de ubicación no está disponible (Enciende tu GPS).";
                            break;
                        case error.TIMEOUT:
                            mensajeError = "❌ Se agotó el tiempo de espera.";
                            break;
                        default:
                            mensajeError = "❌ Error desconocido al obtener ubicación.";
                            break;
                    }
                    status.innerHTML = mensajeError;
                    status.className = 'text-danger fw-bold d-block mt-2';
                    console.error(error);
                    btn.disabled = false;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
    </script>

    <style>
        .container { max-width: 1100px; margin: 40px auto; padding: 20px; }
        .form-title { text-align: center; font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 20px; }
        .form-wrapper { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-container { display: flex; justify-content: center; margin-top: 20px; }
        .btn-submit { padding: 12px 25px; background: #007bff; color: white; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #0056b3; }
        
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
{% endblock %}
